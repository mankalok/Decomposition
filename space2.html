<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>3D 空間探究 V30 - iPad 優化對比版</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; touch-action: none; }
        #scene { 
            width: 850px; height: 500px; perspective: 1000px; 
            background: #ffffff; border-radius: 20px; border: 3px solid #2c3e50;
            position: relative; cursor: move; touch-action: none; overflow: hidden;
        }
        #object-container { width: 0; height: 0; position: absolute; left: 50%; top: 55%; transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(35deg) scale(1.3); }
        .cube { position: absolute; transform-style: preserve-3d; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .face { position: absolute; border: 1px solid rgba(255,255,255,0.4); box-sizing: border-box; }
        .base-face { background: #3498db; opacity: 0.9; }
        .fill-face { background: #e74c3c; opacity: 0.6; border: 2px dashed #ffffff; }
        .dim-label {
            position: absolute; background: rgba(255,255,255,0.95); color: #333;
            padding: 2px 6px; border: 1px solid #2c3e50; border-radius: 4px;
            font-size: 14px; font-weight: bold; z-index: 100; white-space: nowrap;
        }
        .controls { margin-top: 20px; display: flex; gap: 15px; }
        button { padding: 12px 25px; cursor: pointer; border-radius: 10px; border: none; background: #2c3e50; color: white; font-weight: bold; font-size: 16px; }
        #input-area { margin-top: 20px; width: 850px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-left: 8px solid #3498db; }
        .calc-row { margin-bottom: 15px; display: flex; align-items: center; gap: 12px; font-size: 18px; }
        input { width: 70px; padding: 8px; text-align: center; border: 2px solid #ddd; border-radius: 6px; font-size: 18px; }
    </style>
</head>
<body>

    <h2 style="color:#2c3e50;">📐 立體探究 V30：分割 vs 填補 (iPad 觸控版)</h2>

    <div id="scene">
        <div id="object-container"></div>
    </div>

    <div class="controls">
        <button onclick="loadHollow()" style="background:#7f8c8d;">🔄 重置圖形</button>
        <button onclick="showDecomposition()" style="background:#3498db;">✂️ 嘗試「分割法」</button>
        <button onclick="toggleFill()" style="background:#e67e22;">✨ 執行「填補法」動畫</button>
    </div>

    <div id="input-area">
        <div id="math-inputs">請點擊上方按鈕開始探究。</div>
        <div style="margin-top:20px; border-top: 2px solid #eee; padding-top: 20px;">
            <button style="background:#27ae60; color:white; padding:10px 20px; border-radius:8px; border:none; cursor:pointer;" onclick="checkAnswer()">✅ 檢查我的答案</button>
            <span id="result-msg" style="margin-left:20px; font-size:20px; font-weight:bold;"></span>
        </div>
    </div>

<script>
    let rotateX = -20, rotateY = 35, isFilling = false;
    const container = document.getElementById('object-container');
    const scene = document.getElementById('scene');

    // --- iPad & 滑鼠通用 3D 旋轉控制 ---
    let lastX, lastY, isDragging = false;
    const startDrag = (x, y) => { isDragging = true; lastX = x; lastY = y; };
    const moveDrag = (x, y) => {
        if (!isDragging) return;
        rotateY += (x - lastX) * 0.5; rotateX -= (y - lastY) * 0.5;
        container.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.3)`;
        lastX = x; lastY = y;
    };
    const endDrag = () => { isDragging = false; };

    scene.onmousedown = (e) => startDrag(e.clientX, e.clientY);
    window.onmousemove = (e) => moveDrag(e.clientX, e.clientY);
    window.onmouseup = endDrag;

    scene.ontouchstart = (e) => { startDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); };
    scene.ontouchmove = (e) => { moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); };
    scene.ontouchend = endDrag;

    function createCube(x, y, z, w, h, d, type='base', labels=[], id='') {
        const cube = document.createElement('div');
        cube.className = 'cube'; if(id) cube.id = id;
        cube.style.cssText = `width:${w}px; height:${h}px; transform: translate3d(${x}px, ${y}px, ${z}px);`;
        const faceStyles = [
            `width:${w}px; height:${h}px; transform: translateZ(${d/2}px)`, // front
            `width:${w}px; height:${d}px; transform: rotateX(90deg) translateZ(${d/2}px)`, // top
            `width:${d}px; height:${h}px; transform: rotateY(90deg) translateZ(${w - d/2}px)`, // right
            `width:${d}px; height:${h}px; transform: rotateY(-90deg) translateZ(${d/2}px)`, // left
            `width:${w}px; height:${d}px; transform: rotateX(-90deg) translateZ(${h - d/2}px)`, // bottom
            `width:${w}px; height:${h}px; transform: rotateY(180deg) translateZ(${d/2}px)` // back
        ];
        faceStyles.forEach(style => {
            let div = document.createElement('div');
            div.className = `face ${type}-face`;
            div.style.cssText = style;
            cube.appendChild(div);
        });
        labels.forEach(l => {
            let div = document.createElement('div');
            div.className = 'dim-label'; div.innerText = l.text; div.style.cssText = l.pos;
            cube.appendChild(div);
        });
        return cube;
    }

    function loadHollow() {
        container.innerHTML = ''; isFilling = false;
        container.appendChild(createCube(-80, -80, 0, 40, 160, 60, 'base', [{text:'高: 8', pos:'left:-65px; top:40%'}], 'p1'));
        container.appendChild(createCube(40, -80, 0, 40, 160, 60, 'base', [{text:'闊: 3', pos:'right:-75px; top:-30px'}], 'p2'));
        container.appendChild(createCube(-40, -80, 0, 80, 40, 60, 'base', [{text:'長: 10', pos:'top:-45px; left:20px'}], 'p3'));
        container.appendChild(createCube(-40, 40, 0, 80, 40, 60, 'base', [], 'p4'));
        
        const hole = document.createElement('div');
        hole.id = 'hole-labels';
        hole.innerHTML = `<div class="dim-label" style="top:-30px; left:-30px; color:#e74c3c; border-color:#e74c3c;">洞長: 4</div>
                          <div class="dim-label" style="top:10px; left:-30px; color:#e74c3c; border-color:#e74c3c;">洞高: 4</div>`;
        hole.style.cssText = "position:absolute; transform: translate3d(0,0,31px); transform-style:preserve-3d;";
        container.appendChild(hole);

        document.getElementById('math-inputs').innerHTML = `<b>觀察：</b>這是一個中空方框。請比較「分割」與「填補」哪種方法更好算？`;
        document.getElementById('result-msg').innerText = '';
    }

    function showDecomposition() {
        loadHollow();
        document.getElementById('p1').style.transform = 'translate3d(-110px, -80px, 20px)';
        document.getElementById('p2').style.transform = 'translate3d(70px, -80px, 20px)';
        document.getElementById('p3').style.transform = 'translate3d(-40px, -110px, -20px)';
        document.getElementById('p4').style.transform = 'translate3d(-40px, 70px, -20px)';
        document.getElementById('math-inputs').innerHTML = `<p style="color:#2c3e50">⚠️ <b>分割法：</b>需計算 4 個長方體並相加。計算量大且容易數錯重疊位。</p>`;
    }

    function toggleFill() {
        isFilling = !isFilling;
        if(isFilling) {
            loadHollow();
            let fill = createCube(-40, -40, 0, 80, 80, 60, 'fill', [], 'animated-fill-part');
            fill.style.transform = `translate3d(-40px, -500px, 0px)`;
            container.appendChild(fill);
            setTimeout(() => { fill.style.transform = `translate3d(-40px, -40px, 0px)`; }, 50);
            document.getElementById('math-inputs').innerHTML = `
                <p style="color:#e67e22">💡 <b>填補法：</b>大長方體 － 中間洞 = 答案。</p>
                <div class="calc-row">大長方體：<input type="number" id="l1" placeholder="長"> × <input type="number" id="w1" placeholder="闊"> × <input type="number" id="h1" placeholder="高"> = <input type="number" id="v1"></div>
                <div class="calc-row">中間洞：<input type="number" id="l2" placeholder="長"> × <input type="number" id="w2" placeholder="闊"> × <input type="number" id="h2" placeholder="高"> = <input type="number" id="v2"></div>
                <div class="calc-row" style="background:#fef9e7; padding:10px; border-radius:8px;">總體積：<input type="number" id="v_big"> － <input type="number" id="v_small"> = <input type="number" id="v_ans"> cm³</div>
            `;
        } else { loadHollow(); }
    }

    function checkAnswer() {
        const v_ans = +document.getElementById('v_ans')?.value;
        const m = document.getElementById('result-msg');
        if(v_ans === 192) { m.innerHTML = "🎉 正確！(240 - 48 = 192)"; m.style.color = "green"; }
        else { m.innerHTML = "❌ 再算算看，提示：大體是 10×3×8，洞是 4×3×4。"; m.style.color = "red"; }
    }

    window.onload = loadHollow;
</script>
</body>
</html>
